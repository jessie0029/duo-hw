name: Build Android app
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build signed APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Publish to the "android-app" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk PIANO-DUO-HW.apk
          gh release view android-app >/dev/null 2>&1 || gh release create android-app --title "PIANO DUO HW – Android app" --notes "Download PIANO-DUO-HW.apk on your phone and open it to install."
          gh release upload android-app PIANO-DUO-HW.apk --clobber
